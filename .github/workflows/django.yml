name: Django CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-assurance:
    name: Quality Assurance (Lint & Security)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install QA Tools
      run: |
        python -m pip install --upgrade pip
        pip install ruff bandit

    - name: Run Ruff Linter & Formatter Check
      run: |
        # Ruff checks for syntax, code quality, and formatting
        ruff check .
        ruff format --check .

    - name: Run Security Analysis (Bandit)
      run: |
        # Bandit scans Python code for security issues
        bandit -r core/ biomedApp/ -s B101 # Ignore assert checks (commonly used in tests)

  test:
    name: Django Tests
    runs-on: ubuntu-latest
    needs: quality-assurance # Run tests only if syntax/quality checks pass
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Django System Checks
      run: |
        python manage.py check

    - name: Run Test Suite
      env:
        SECRET_KEY: "django-insecure-ci-test-key"
        DEBUG: "False"
      run: |
        python manage.py test

  deploy:
    name: Deploy to Render
    needs: test # Deploy only if all tests pass
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Trigger Deploy Hook
      env:
        DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      run: |
        if [ -z "$DEPLOY_HOOK" ]; then
          echo "RENDER_DEPLOY_HOOK_URL secret is not set. Skipping deployment step."
          exit 1
        fi
        curl -f -X POST "$DEPLOY_HOOK"
